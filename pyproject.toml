[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rdr-transit"
version = "0.1.0"
description = "High-speed, OS-agnostic peer-to-peer LAN file transfer tool with a responsive nmtui-inspired TUI and CLI"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Victor", email = "victor@local" }
]
requires-python = ">=3.9"
dependencies = [
    "textual>=0.70.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
]

[project.scripts]
rdr-transit = "rdr_transit.cli:main"
transit = "rdr_transit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rdr_transit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]
